  <head>

    <!-- Open Graph / Facebook, WhatsApp, LinkedIn -->

    <meta property="og:image:secure_url" content="https://zahlenschatz.bjoern-wenderoth.de/bilder/share-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capys Zahlenschatz" />
    <meta name="twitter:description" content="Eine kleine Lernreise für Kinder: Mit Capy dem Capybara spielerisch das kleine Einmaleins üben – kostenlos, online und ohne Konto spielbar." />

  </head>
  <body>
    <div id="root"></div>
    <div id="rotate-overlay" role="alert" aria-labelledby="rotate-overlay-title" aria-describedby="rotate-overlay-copy">
      <div class="rotate-overlay-cloud rotate-overlay-cloud-one" aria-hidden="true"></div>
      <div class="rotate-overlay-cloud rotate-overlay-cloud-two" aria-hidden="true"></div>

      <div class="rotate-overlay-stage">
        <div class="rotate-overlay-capy-side" aria-hidden="true">
          <span class="rotate-overlay-number rotate-overlay-number-one">2</span>
          <span class="rotate-overlay-number rotate-overlay-number-two">×</span>
          <div class="rotate-overlay-capy"></div>
        </div>

        <div class="rotate-overlay-card">
          <div class="rotate-overlay-device" aria-hidden="true">
            <svg class="rotate-overlay-arrow" viewBox="0 0 96 96" fill="none">
              <path d="M22 31A35 35 0 0 1 76 27" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
              <path d="M65 17 78 27 67 39" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="rotate-overlay-phone">
              <svg viewBox="0 0 36 54" fill="none">
                <rect x="2.5" y="2.5" width="31" height="49" rx="7" fill="#fff" stroke="currentColor" stroke-width="5" />
                <line x1="14" y1="45" x2="22" y2="45" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              </svg>
            </span>
          </div>

          <div class="rotate-overlay-copy">
            <span class="rotate-overlay-kicker">Fast geschafft!</span>
            <h1 id="rotate-overlay-title">Bitte hochkant drehen</h1>
            <p id="rotate-overlay-copy">Dann kann Capys Abenteuer weitergehen!</p>
          </div>
        </div>
      </div>

      <div class="rotate-overlay-landscape" aria-hidden="true">
        <span class="rotate-overlay-hill rotate-overlay-hill-back"></span>
        <span class="rotate-overlay-hill rotate-overlay-hill-front"></span>
        <span class="rotate-overlay-flower rotate-overlay-flower-one">✿</span>
        <span class="rotate-overlay-flower rotate-overlay-flower-two">✿</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
